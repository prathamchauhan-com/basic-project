<!DOCTYPE HTML>
<html>

<head>
    <title>
        flexbox_PS
    </title>
</head>

<body>
    <div style="display: flex;
    flex-direction: row; margin-bottom: 40px">
        <div style="background-color: pink; width: 200px">200px</div>
        <div style="background-color: lightblue; width: 75px;">75px</div>
    </div>


    <div style="display: flex;
    flex-direction: row; margin-bottom: 40px">
        <div style="background-color: pink; width: 50px">50px</div>
        <div style="background-color: lightblue; flex: 1;">flex:1</div>
        <div style="background-color: lightgrey; width: 75px;">75px</div>
    </div>


    <div
      style="display: flex;
      flex-direction: row;
      justify-content: space-between;
      margin-bottom: 40px;"
    >
        <div style="background-color: pink;">item1</div>
        <div style="background-color: pink;">item2</div>
        <div style="background-color: pink;">item3</div>
        <div style="background-color: pink;">item4</div>
    </div>


    <div style="display: flex;
    border-width: 1px;
    border-style: solid;
    border-color: grey;
    height: 50px;
    justify-content: space-between;
    align-items: center;">
        <div style="background-color: pink;">item1</div>
        <div style="background-color: pink;">item2</div>
    </div>
    
</body>

</html>
