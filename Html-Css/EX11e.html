<!DOCTYPE html>
<html>

<head>
    <title>Ex11e</title>

    <style>
        body {
            height: 1000px;
            background-color: rgb(204, 204, 204);
        }

        .header {
            position: fixed;
            height: 30px;
            top: 0;
            left: 0;
            right: 0;
            padding-left: 50px;
            padding-right: 50px;
            padding-top: 10px;
            padding-bottom: 10px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
        }

        .sec-1 {


            display: flex;
            align-items: center;
        }

        .pic {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 15px;
        }

        .name {
            font-family: Arial;
            font-size: 15px;
            margin-left: 8px;
            font-weight: bold;
        }

        .add-bu{
            background-color: rgb(29, 140, 214);
            color: white;
            border: none;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 3px;
            padding-bottom: 3px;
            border-radius: 6px;
            margin-right: 5px;
        }

        .msg-bu{
            background-color: rgb(214, 214, 214);
            color: black;
            border: none;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 3px;
            padding-bottom: 3px;
            border-radius: 6px;
        }


    </style>
</head>

<body>
    <div class="header">

        <div class="sec-1">
            <img class="pic" src="cat.jpg">
            <div class="name">
                Oliver Cat
            </div>
        </div>



        <div class="sec-2">
            <button class="add-bu">Add Freind</button>
            <button class="msg-bu">Message</button>
        </div>
    </div>

</body>

</html>
