<!DOCTYPE html>
<html>
    <head>
        <style>
    
            .text-bar{
                border-width: .94px;
                border-color: rgb(192, 192, 192);
                border-style: solid;
                border-radius: 6px;
                padding-left: 9px;
                padding-top: 3px;
                padding-bottom: 3px;
                padding-right: 10px;
                font-size: 10px;
                margin-bottom: 10px;
                margin-right: 5px;

            }

            .text-bar:hover{
                border-width: 1px;
                border-color: rgb(22, 102, 221);
                border-style: solid;
            }

            .Search-bar{
                border-radius: 20px;
                border: none;
                width: 200px;
                font-size: 10px;
                padding-left: 9px;
                padding-top: 7px;
                padding-bottom: 7px;
                padding-right: 10px;
                box-shadow: 3px 3px 10px rgba(134, 133, 133, 0.7);
                margin-bottom: 40px;
                margin-left: 10px;

            }

            p{
                font-family: Arial;
                color: rgb(100, 100, 100);   
            }

            .label{
                margin-bottom: 4px;
                font-size: 12px;
                
            }
            .lin{
                padding-top: 5px;
                padding-bottom: 5px;
                padding-left: 15px;
                padding-right: 15px;
                border-width: 2px;
                border-style: solid;
                border-color: grey;
                border-radius: 4px;
                font-size: 14px;
                width: 232px;
                margin-bottom: 2px;
            }



            .lab{
                font-size: 10px;
                margin-bottom: 10px;
                font-weight: bold;
                color: rgb(124, 122, 122);
            }

            .Agree-button{
                color: white;
                background-color: rgb(17, 133, 211);
                border: none;
                padding-top: 8px;
                padding-bottom: 8px;
                width: 264px;
                font-size: 14px;
                border-radius: 23px;
                margin-right: 300px;
            }

            
        </style>
    </head>

    <body>
        <input class="text-bar" type="text" placeholder="Search">
        <input class="Search-bar" type="text" placeholder="Search Google or type a URL">

        <P class="label">
            Email
        </P>
        <input class="lin" type="email">

        <p class="lab">
            By clicking Agree & join, youi agree to the Privacy Policy.
        </p>

        <button class="Agree-button" >
            Agree & Join
        </button>


    </body>
</html>
