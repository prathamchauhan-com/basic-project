<!DOCTYPE html>
<html>
    <head>
        <title>ex12b</title>
        <style>
            .blank{
                background-color: grey;
                height: 180px;
                width: 320px;
                bottom: 20px;
                right: 20px;
                position: fixed;
            }

            .close-bu{
                background-color: black;
                color: white;
                font-family: Arial;
                font-size: 25px;
                padding-left: 11px;
                padding-right: 11px;
                padding-top: 5px;
                padding-bottom: 5px;
                border-radius: 27px;

              
                left: -14px;
                top: -14px;
                position: absolute;
            }

            .time{
                position: absolute;
                background-color: black;
                color: white;
                bottom: 5px;
                right: 5px;
                padding-left: 5px;
                padding-right: 5px;
                padding-top: 3px;
                border-radius: 3px;
                font-size: 12px;
                font-family: Arial;
                padding-bottom: 3px;
            }

            body{
                height: 1000px;
            }
        </style>
    </head>

    <body>
        <div class="blank">
            <div class="close-bu">X</div> 
            <div class="time">0:30</div>
        </div>

    </body>
</html>
