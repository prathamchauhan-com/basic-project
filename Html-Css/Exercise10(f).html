<!DOCTYPE html>
<html>
    <head>
        <title>ex. 10(f)</title>
        <style>
            div{
                font-family: Arial;
            }
            .pic{
                width: 54px;
                height: 54px;
                object-fit: cover;
                border-radius: 28px;
            }
            .cont{
                margin-top: 30px;
                margin-left: 30px;
                display: flex;
            }
            .sub{
                margin-left: 12px;
            }

            .email{
                color: rgb(160, 159, 159);
                
            }

            .basic-info{
                margin-top: 5px;
                width: 360px; 
            }

            .sub-cont{
                margin-top: 14px;
                display: flex;
                width: 356px;
                border-width: 1px;
                border-style: solid;
                border-color: rgb(224, 224, 224);
                border-radius: 19px;
                align-items: center;
                overflow: hidden;               
            }
            .blank{
                background-color: rgb(209, 207, 207);
                width: 100px;
                height: 110px;
            
                margin-right: 10px;
            }
            .channel{
                margin-bottom: 6px;
                color: rgb(209, 207, 207);
               
            }
            .back{
                width: 240px;
                
                line-height: 22px;
            }
        </style>
    </head>

    <body>
        <div class="cont">
            <div >
                <img class="pic" src="cat.jpg">
            </div>
            <div class="sub">
                <div class="info"><b>supersipmle.dev</b> <span class="email">@SuperSimpleDev</span></div>
                <div class="basic-info">What is backened web development? A complete overview. New video is up!</div>
                


                <div class="sub-cont">
                    <div class="blank"></div>
                    <div>
                        <div class="channel">
                            youtube.com
                        </div>
                        <div class="back">Backened web development - a complete overview (2021)

                        </div>
                    </div>
                </div>
                    
                
                
            </div>
        </div>
    </body>
</html>
