<!DOCTYPE html>
<html>
    <head>
        <title>Exercise9(f)</title>
        <style>
            div{
                font-family: Arial;
                color: white;
                font-size: 15px;
                font-weight: bold;
            }
            .se-box{
                width: 500px;
                padding-left: 10px;
                padding-top: 5px;
                padding-bottom: 5px;
                border-radius: 22px;
                border: none;
                margin-left: 20px;
                margin-right: 20px;
            }

            .down{
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 6px;
                padding-bottom: 6px;
                background-color: rgb(148, 92, 212);
                border-color: white;
                border-width: 1px;
                border-style: solid;
                font-size: 16px;
                color: white;
                border-radius: 2px;
                
            }
            .layout{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                background-color: rgb(148, 92, 212);
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 8px;
                padding-bottom: 8px;
                align-items: center;
            }
        </style>
    </head>

    <body>
        <div class="layout">
            <div>Home</div>
            
                <input class="se-box" type="text" placeholder="Search">
            
            
                <button class="down">Download</button>
            
        </div>
    </body>
</html>
