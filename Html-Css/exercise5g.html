<!DOCTYPE html>
<html>

<head>
    <style>
        .chat-box{
            width: 400px;
            box-shadow: 2px 2px 10px rgba(119, 117, 117, 0.6);
            padding-left: 9px;
            border-radius: 4px;
            padding-right: 9px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .pea {

            width: 40px;
            height: 40px;
            border-radius: 30px;
            object-fit: cover;
            margin-right: 5px;
            vertical-align: middle;
        }

        .text-bar {

            font-size: 16px;
            border: none;
            width: 240px;
            vertical-align: middle;
        }

        .tweet-button {
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            background-color: rgb(17, 156, 211);
            padding-left: 18px;
            padding-right: 18px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 20px;

            vertical-align: middle;
            margin-left: 5px;
            cursor: pointer;
        }

        .tweet-button:hover {
            color: rgb(17, 156, 211);
            background-color: rgb(109, 200, 236);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="chat-box">
        <img class="pea" src="download.jpeg">

        <input class="text-bar" type="text" placeholder="What's happening">

        <button class="tweet-button">Tweet</button>
    </div>
</body>

</html>
