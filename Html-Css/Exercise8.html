<!Doctype>
<html>
<head>
    <title>
        grid practice
    </title>
</head>

<body>
    <div style="display: grid;
    grid-template-columns: 200px 75px;
    margin-bottom: 60px   
    
    ">
       <div style="background-color: skyblue; ">200</div>
       <div style="background-color: pink; ">75</div> 
    </div>

    <div style="display: grid;
    grid-template-columns: 50px 1fr 75px;;
    margin-bottom: 60px   
    
    ">
       <div style="background-color: skyblue; ">col1</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: skyblue;">col3</div> 
    </div>



    <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    column-gap: 20px;
    row-gap: 10px;
    margin-bottom: 60px   
    
    ">
       <div style="background-color: pink; ">col1</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: pink;">col3</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: pink; ">col2</div>
       <div style="background-color: pink; ">col2</div> 
    </div>

</body>
</html>
