<!DOCTYPE html>
<html>

<head>
    <title>Ex. 10(d)</title>
    <style>
        .container{
            width: 337px;
            border-width: 1px;
            border-style: solid;
            border-color: rgb(218, 217, 217);;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.25);
            padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 15px;
            padding-right: 15px;
            margin-top: 20px;
            margin-left: 20px;
        }
        div{
            font-family: Arial;
        }
        .pic{
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 25px;
            margin-right: 7px;
        }
        .in{
            font-size: 12px;
            color: rgb(187, 187, 187);
            margin-bottom: 19px;
            
        }
        .name{
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 1px;
        }

        .time{
            font-size: 12.5px;
            color: rgb(187, 187, 187);
        }
        .info{
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .intro{
            font-size: 14px;
            color: rgb(187, 187, 187);;
        }

        .main{
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .name-time{
            display: flex;
            justify-content: space-between;
            align-items: center;
           
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="in">ALL INBOXES</div>

        <div class="main">
            <div>
                <img class="pic" src="cat.jpg">
            </div>

            <div>
                <div class="name-time">
                    <div class="name">Chewy Promotions</div>
                    <div class="time">4:58 PM</div>
                </div>

                <div class="info">Biggest sales of the year!</div>
                <div class="intro">Hey there! we're writing to tell you about our...</div>
            </div>
        </div>


        <div class="main">
            <div>
                <img class="pic" src="cat2.jpg">
            </div>

            <div>
                <div class="name-time">
                    <div class="name">Best Buy</div>
                    <div class="time">!2:32 PM</div>
                </div>

                <div class="info">Your Best Buy eReceipt</div>
                <div class="intro">Thank you for shopping at Best Buy, here is...</div>
            </div>
        </div>




         

        <div class="main">
            <div>
                <img class="pic" src="dog2.jpg">
            </div>

            <div>
                <div class="name-time">
                    <div class="name">Netflix</div>
                    <div class="time">9:00 PM</div>
                </div>

                <div class="info">Here's what's coming soon to Netflix</div>
                <div class="intro">Brand new movies and shows, old favourites..</div>
            </div>
        </div>
    </div>
    
</body>

</html>
