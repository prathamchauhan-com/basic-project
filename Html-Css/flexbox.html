<!DOCTYPE html>
<html>

<head>
    <title>Flexbox_ps</title>
</head>

<body style="padding-bottom: 500px;">
    <div style="display: flex;
        flex-direction: row;
        ;">
        <div style="background-color: lightblue;">div1</div>
        <div style="background-color: pink;">div2<p>text</p></div>
    </div>

    <div style="display: flex;
        flex-direction: row;
        margin-top: 30px;
        ;">
        <div style="background-color: lightblue; width: 100px">div1</div>
        
        <div style="background-color: skyblue; flex: 2;">div2</div>
        <div style="background-color: pink; flex: 1;">flex: 1</div>
    </div>

    <div style="display: flex;
        flex-direction: row;
        margin-top: 30px;
        height: 70px;
        border-style: solid;
        border-width: 1px;
        border-color: grey;
        justify-content: space-between;
        ;">
        <div style="background-color: lightblue; width: 100px">div1</div>
        
        <div style="background-color: skyblue; width: 100px;">div2</div>
        <div style="background-color: pink; width: 100px;">flex: 1</div>
    </div>


    <div style="display: flex;
        flex-direction: row;
        margin-top: 30px;
        height: 70px;
        border-style: solid;
        border-width: 1px;
        border-color: grey;
        justify-content: center;
        ;">
        <div style="background-color: lightblue; width: 100px">div1</div>
        
        <div style="background-color: skyblue; width: 100px;">div2</div>
        <div style="background-color: pink; width: 100px;">flex: 1</div>
    </div>



    <div style="display: flex;
    flex-direction: row;
    margin-top: 30px;
    height: 70px;
    border-style: solid;
    border-width: 1px;
    border-color: grey;
    justify-content: space-between;
    align-items: end;

    ;">
    <div style="background-color: lightblue; width: 100px">div1</div>
    
    <div style="background-color: skyblue; width: 100px;">div2</div>
    <div style="background-color: pink; width: 100px;">flex: 1</div>
</div>
</body>

</html>
