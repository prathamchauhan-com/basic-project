<!DOCTYPE html>
<html>

<head>
    <title>Grid practice</title>
</head>

<body style="padding-bottom: 1000px;">
    <div style="
        display: grid;
        grid-template-columns: 100px 100px;
  
            
        ">
        <div style="background-color: skyblue;">div 1</div>
        <div style="background-color: pink;">div 2<p>hey</p>
        </div>
        
    </div>


    <div style="
        display: grid;
        grid-template-columns: 100px 100px;
        margin-top: 20px;
        align-items: center;
        ">
        <div style="background-color: skyblue;">div 1</div>
        <div style="background-color: pink;">div 2<p>hey</p>
        </div>
    </div>



    <div style="
        display: grid;
        grid-template-columns: 100px 1fr 1fr;
        margin-top: 20px;
        ">
        <div style="background-color: skyblue;">100px</div>
        <div style="background-color: pink;">1fr</div>
        <div style="background-color: grey;">1fr</div>
    </div>



    <div style="
        display: grid;
        grid-template-columns: 100px 1fr 2fr;
        margin-top: 20px;
        ">
        <div style="background-color: skyblue;">100px</div>
        <div style="background-color: pink;">1fr</div>
        <div style="background-color: grey;">2fr</div>
    </div>




    <div style="
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 40px;
        margin-top: 100px  

        ">
        <div style="background-color: skyblue; height: 200px">div 1</div>
        <div style="background-color: pink; height: 200px">div 2</div>
        <div style="background-color: skyblue; height: 200px">div4</div>
        <div style="background-color: pink; height: 200px">div 2</div>
        <div style="background-color: skyblue; height: 200px">div4</div>
        <div style="background-color: pink; height: 200px">div 2</div>

    </div>

</body>

</html>
