<!DOCTYPE html>
<html>
    <head>
        <title>Ex7c</title>
        <style>
            .preview{
                width: 300px;
                display: inline-block;
                border-width: 1px;
                border-color: rgb(122, 122, 122);
                border-style: solid;
                padding-bottom: 18px;
                padding-left: 10px;
                margin-right: 15px;
                vertical-align: top;
                margin-bottom: 30px;
            }

            .title{
                font-family: Arial;
            }

            .music{
                display: inline-block;
                width: 320px;
                background-color: rgb(37, 36, 36);
                vertical-align: top;
            }

            .intro{
                font-family: Arial;
                font-size: 20px;
                padding-left: 10px;
                padding-right: 10px;
                color: white;
                font-weight: bold;
                text-decoration: underline;
                text-align: center;
            }

            .introbrief{
                font-family: Arial;
                color: rgb(163, 159, 159);
                font-size: 13px;
                padding-left: 10px;
                padding-right: 10px;
            }
        </style>
    </head>

    <body>
        <div class="preview">
            <p class="title">
                Satisfied with our service?
            </p>

            <button>
                Yes
            </button>

            <button>
                No
            </button>
        </div>

        <div class="music">
            <p class="intro">
                Install Youtube Music
            </p>
            <p class="introbrief">
                Add Youtube music to your desktop for quick and easy access
            </p>
        </div>
    </body>
</html>
