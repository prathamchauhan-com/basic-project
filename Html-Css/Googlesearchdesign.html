<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            text-align: center;
        }

        .logo {
            width: 250px;
            margin-bottom: 10px;
        }

        .search {
            border-radius: 20px;
            border: none;
            width: 500px;
            font-size: 16px;
            padding-left: 9px;
            padding-top: 7px;
            padding-bottom: 7px;
            padding-right: 10px;
            box-shadow: 3px 3px 10px rgba(134, 133, 133, 0.7);
        }

        button{
            font-family: Arial;
            font-size: 15px;
            border: none;
            margin-top: 36px;
            padding-left: 14px;
            padding-right: 14px;
            padding-top: 8px;
            padding-bottom: 8px;
            background-color: rgb(236, 234, 234);        }

        .google{
            margin-right: 10px;         
        }
    </style>
</head>

<body>
    <div >
        <img class="logo" src="download.png">
    </div>

    <div>
        <input class="search" type="text" placeholder="Search Google or type a URL">
    </div>

    <div>
        <button class="google">Google Search</button>

        <button class="iam">I'm Feeling Lucky</button>
    </div>
</body>

</html>
