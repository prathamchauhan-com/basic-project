<!DOCTYPE html>
<html>
    <head>
        <title>Ex9g</title>
        <style>
            p{
                margin: 0;
                line-height: 30px;
            }

            div{
                font-family: Arial;
            }
            .imgs{
                width: 80px;
                height: 80px;
                object-fit: cover;
                border-radius: 40px;
                margin-right: 17px;
            }

            .name{
                font-size: 22px;
                font-weight: bold;
            }

            .cate,
            .breed{
                color: rgb(187, 184, 184);
                font-size: 19px;
            }

            .folow-bu{
                background-color: rgb(73, 178, 248);
                color: white;
                border: none;
                font-size: 21px;
                font-weight: bold;
                padding-left: 12px;
                padding-top: 8px;
                padding-right: 12px;
                padding-bottom: 8px;
                border-radius: 7px;
                margin-left: 100px;
            }

            .box{
                display: flex;
                flex-direction: row;
                margin-bottom: 36px;
                align-items: center;  
            }

            .info{
                width: 200px;
            }
        
        </style>
    </head>

    <body>
        <div class="box">
            <img class="imgs" src="cat.jpg">
            <div class="info">
                <p class="name">oliver</p>
                <p class="breed">the cat</p>
                <p class="cate">Popular</p>
            </div>
            <button class="folow-bu">Follow</button>
        </div>

        <div class="box">
            <img class="imgs" src="cat2.jpg">
            <div class="info">
                <p class="name">Mimi</p>
                <p class="breed">Sleepy cat</p>
                <p class="cate">Popular</p>
            </div>
            <button class="folow-bu">Follow</button>
        </div>



        <div class="box">
            <img class="imgs" src="dog.jpg">
            <div class="info">
                <p class="name">Rex</p>
                <p class="breed">Happy Bulldog</p>
                <p class="cate">Popular</p>
            </div>
            <button class="folow-bu">Follow</button>
        </div>

    </body>
</html>
