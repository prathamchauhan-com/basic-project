<!DOCTYPE html>
<html>
    <head>
        <title>ex 9(e)</title>
        <style>
            div{
                font-family: Arial;
            }
            .flexbox{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                padding-left: 13px;
                padding-right: 13px;
                padding-top: 10px;
                padding-bottom: 10px;
                align-items: center;
            }
            .containers{
                width: 300px;
                border-style: solid;
                border-width: 1px;
                border-color: rgb(202, 199, 199);
                border-radius: 8px;
            }

            .noti{
                background-color: rgb(35, 160, 218);
                color: white;
                font-size: 14px;
                font-weight: bold;
                padding-left: 8px;
                padding-right: 8px;
                padding-top: 2px;
                padding-bottom: 2px;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>

        <div class="containers">
            <div class="flexbox">
                <div>Home</div>
                <div class="noti">14</div>
            </div>
    
            
            <div class="flexbox">
                <div>Notifications</div>
                <div class="noti">3</div>
            </div>
    
            
            <div class="flexbox">
                <div>Messages</div>
                <div class="noti">5</div>
            </div>
        </div>
        

    </body>
</html>
