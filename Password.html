<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password</title>
  <style>
    div {
      font-size: .75em;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      text-align: center;
    }

    #main {
      font-size: 50em;
      font-weight: 700;
      color: rgb(250, 157, 157);
    }

    #password {
      font-size: 45em;
      width: 100px;
      text-align: center;
      border-radius: 5px;
      padding: 2px;
      color: rgb(210, 255, 63);
      font-weight: bold;
      margin: 6px;
    }

    button {
      margin-top: 30px;
      padding: 15px;
      color: white;
      background-color: red;
      border: none;
      font-size: 50em;
      border-radius: 5px;
      cursor: pointer;
    }

    #il{
      font-size: 20px;
      vertical-align: middle;
      color: rgb(89, 89, 249);
    }
    #result{
      margin-top: 30px;
      font-size: 30em;
      display: block;
      color: #07ff1b;
    }
    h1{
      color: rgb(90, 0, 15);
    }
  </style>
</head>

<body>
  <div>
    <h1>Password Generator:</h1>

    <label id="main" for="password">#Enter no. of digit that your password contain</label>
    <input type="number" id="password" value="1" min="1"><br>
    <br>
    
      <input type="checkbox" id="lowercase" style="transform : scale(2)">
      <label id="il" for="lowercase">IncludeLowercase</label><br>

      <input type="checkbox" id="uppercase" style="transform : scale(2)">
      <label id="il" for="uppercase">IncludeUppercase</label><br>

      <input type="checkbox" id="number" style="transform : scale(2)">
      <label id="il" for="number">IncludeNumber</label><br>

      <input type="checkbox" id="symbol" style="transform : scale(2)">
      <label id="il" for="symbol">IncludeSymbol</label><br> <br>
    


    <button onclick="passwordgenerate ()">
      Submit</button>
    <div id="result"></div>
  </div>

  <script>
    function passwordgenerate() {

      const length = Number(document.getElementById("password").value);
      const includelowercase = document.getElementById("lowercase").checked;
      const includeuppercase = document.getElementById("uppercase").checked;
      const includenumber = document.getElementById("number").checked;
      const includesymbol = document.getElementById("symbol").checked;

      const lowercase = "abcdefghijklmnopqrstuvwxyz";
      const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const number = "0123456789";
      const symbol = "!~@#$%^&*?:";

      let allowedChars = "";
      let password = "";

      const result = document.getElementById("result");

      allowedChars += includelowercase ? lowercase : "";
      allowedChars += includeuppercase ? uppercase : "";
      allowedChars += includenumber ? number : "";
      allowedChars += includesymbol ? symbol : "";

      if (length <= 0) {
        document.getElementById("result").textContent = `Password length not less than 1`;
        return;
      }
      if (allowedChars.length === 0) {
        document.getElementById("result").textContent = `Select atleast one set of character!`;
        return;
      }
      for (let i = 0; i < length; i++) {
        const randomnum = Math.floor(Math.random() * allowedChars.length);
        password += allowedChars[randomnum];
      }
      result.textContent = `Generate password: ${password}`;
    }



  </script>
</body>

</html>
