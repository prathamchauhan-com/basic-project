<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra - AI Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="as.css">
</head>

<body class="bg-gray-900 text-gray-100 flex flex-col items-center justify-center min-h-screen">

  <!-- Chat Container -->
  <div class="flex flex-col w-full max-w-2xl h-[85vh] bg-gray-800 rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="bg-teal-700 text-white text-center py-4 text-lg font-semibold">
      💬 Astra — AI Chat Assistant
    </div>

    <!-- Chat Window -->
    <div id="chat-window" class="flex flex-col flex-grow overflow-y-auto p-4 space-y-3">
      <!-- Messages will appear here dynamically -->
    </div>

    <!-- Input Form -->
    <form id="chat-form" class="flex items-center bg-gray-700 p-3 space-x-2">
      <input 
        id="message-input"
        type="text"
        placeholder="Type your message..."
        class="flex-grow bg-gray-600 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
        required
      >
      <button 
        id="send-button"
        type="submit"
        class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-4 py-2 rounded-xl transition duration-200"
      >
        Send
      </button>
    </form>
  </div>

  <!-- Error Modal -->
  <div 
    id="error-modal"
    class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
  >
    <div class="bg-white text-gray-800 p-6 rounded-2xl shadow-lg w-80 text-center">
      <h2 class="text-lg font-semibold mb-2">⚠️ Error</h2>
      <p id="error-message" class="mb-4">Something went wrong.</p>
      <button 
        id="close-modal-btn"
        class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg"
      >
        Close
      </button>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="as.js"></script>
</body>
</html>
