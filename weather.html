<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="wea.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1 class="title">🌍 Weather App</h1>
      <button id="themeToggle">🌙</button>
    </header>

    <form class="weatherForm">
      <div class="search-box">
        <input type="text" class="cityInfo" placeholder="Enter city name..(Eg: Mumbai)" required>
        <button type="submit"><i class="wi wi-search"></i></button>
      </div>
    </form>

    <!-- Loading -->
    <div class="loading" id="loading" style="display:none;">
      <div class="spinner"></div>
    </div>

    <!-- Current Weather -->
    <div class="main-card" id="weatherCard" style="display:none;">
      <div class="weather-header">
        <h2 class="cityD"></h2>
        <p class="dateD"></p>
      </div>
      <div class="weather-body">
        <i class="wi weatherIcon"></i>
        <div>
          <p class="tempD"></p>
          <p class="descD"></p>
          <p class="humidityD"></p>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <div class="forecast" id="forecastContainer" style="display:none;">
      <h3>Next 5 Days</h3>
      <div class="forecast-grid" id="forecastGrid"></div>
    </div>

    <p class="errorD" id="errorMsg"></p>
  </div>

  <script src="weather.js"></script>
</body>
</html>
